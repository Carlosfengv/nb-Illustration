<svg xmlns="http://www.w3.org/2000/svg" width="336" height="336" viewBox="0 0 336 336" role="img" aria-labelledby="title desc">
<title id="title">六路汇聚 · light</title><desc id="desc">Six lines converge on a selected hub.</desc>
<defs>
  <linearGradient id="frame-edge" x2="0" y2="1">
