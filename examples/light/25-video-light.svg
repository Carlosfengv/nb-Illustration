<svg xmlns="http://www.w3.org/2000/svg" width="336" height="336" viewBox="0 0 336 336" role="img" aria-labelledby="title desc">
<title id="title">视频播放 · light</title><desc id="desc">A 4K video tile floats forward with a central play button.</desc>
<defs>
  <linearGradient id="frame-edge" x2="0" y2="1">
    <stop stop-color="#CCCCCC"/><stop offset=".57" stop-color="#CCCCCC" stop-opacity=".73"/>
    <stop offset="1" stop-color="#E0E0E0" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="idle-face" x2=".28" y2="1">
    <stop stop-color="#F1F1F1"/><stop offset="1" stop-color="#F8F8F8"/>
  </linearGradient>
  <linearGradient id="active-face" x2=".3" y2="1">
    <stop stop-color="#FFFFFF"/><stop offset=".46" stop-color="#F1F1F1"/><stop offset="1" stop-color="#EEEEEE"/>
  </linearGradient>
  <linearGradient id="active-rim" x2=".35" y2="1">
    <stop stop-color="#404040"/><stop offset=".58" stop-color="#858585"/><stop offset="1" stop-color="#8B8B8B"/>
  </linearGradient>
  <linearGradient id="sheen" x2="0" y2="1">
    <stop stop-color="#FFFFFF" stop-opacity=".57"/><stop offset=".48" stop-color="#FFFFFF" stop-opacity=".19"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop stop-color="#737373" stop-opacity=".115"/><stop offset=".63" stop-color="#737373" stop-opacity=".04"/>
    <stop offset="1" stop-color="#737373" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="area" gradientUnits="userSpaceOnUse" x1="0" y1="130" x2="0" y2="304">
    <stop stop-color="#858585" stop-opacity=".31"/><stop offset="1" stop-color="#858585" stop-opacity=".025"/>
  </linearGradient>
  <linearGradient id="chart-line" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="310" y2="0">
    <stop stop-color="#CCCCCC"/><stop offset=".43" stop-color="#666666"/><stop offset=".72" stop-color="#858585"/>
    <stop offset="1" stop-color="#CCCCCC"/>
  </linearGradient>
  <linearGradient id="skin" x2=".85" y2="1">
    <stop stop-color="#F5F5F5"/><stop offset=".68" stop-color="#F5F5F5"/><stop offset="1" stop-color="#9B9B9B"/>
  </linearGradient>
  <linearGradient id="cloth" x2=".9" y2="1">
    <stop stop-color="#9B9B9B"/><stop offset=".45" stop-color="#4D4D4D"/><stop offset="1" stop-color="#EEEEEE"/>
  </linearGradient>
  <radialGradient id="periphery-fade" gradientUnits="userSpaceOnUse" cx="168" cy="164" r="185">
    <stop offset=".39" stop-color="#FFFFFF"/><stop offset=".77" stop-color="#FFFFFF" stop-opacity=".53"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="lower-fade" gradientUnits="userSpaceOnUse" x1="0" y1="194" x2="0" y2="327">
    <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <mask id="periphery" maskUnits="userSpaceOnUse" x="0" y="0" width="336" height="336">
    <rect width="336" height="336" fill="url(#periphery-fade)"/>
  </mask>
  <mask id="lower" maskUnits="userSpaceOnUse" x="0" y="0" width="336" height="336">
    <rect width="336" height="336" fill="url(#lower-fade)"/>
  </mask>
  <clipPath id="globe-clip"><circle cx="168" cy="169" r="111"/></clipPath>
  <pattern id="map-dots" width="3" height="3" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r=".58" fill="#666666" opacity=".75"/>
  </pattern>
  <filter id="cast" x="-65%" y="-100%" width="230%" height="340%" color-interpolation-filters="sRGB">
