<svg xmlns="http://www.w3.org/2000/svg" width="336" height="336" viewBox="0 0 336 336" role="img" aria-labelledby="title desc">
<title id="title">人脸识别 · light</title><desc id="desc">A vector portrait is framed by a focused face-recognition tile.</desc>
<defs>
